# --- Server ---
server.port=8080

# --- H2 (in-memory) for dev ---
spring.datasource.url=jdbc:h2:mem:musicmartdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=root
spring.datasource.password=Niduk32@
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console (dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Load data.sql after schema is ready
spring.sql.init.mode=always

# If you want MySQL instead, comment the H2 block above and use:
# spring.datasource.url=jdbc:mysql://localhost:3306/musicmart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
